name: Debian trixie bundle

# Builds Quickshell for Debian 13 (not packaged in trixie), wraps it in a .deb
# and zips it together with the Minflair Quickshell config + installer.

on:
  push:
    branches: [debian-trixie]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      quickshell_ref:
        description: Quickshell git tag/branch to build
        default: v0.3.0

env:
  QS_REF: ${{ inputs.quickshell_ref || 'v0.3.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git zip file python3 shellcheck \
            build-essential cmake ninja-build pkg-config dpkg-dev spirv-tools \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-declarative-dev-tools qt6-shadertools-dev qt6-wayland-dev qt6-wayland-private-dev \
            qt6-svg-dev libcli11-dev libjemalloc-dev \
            libwayland-dev libwayland-bin wayland-protocols libdrm-dev libgbm-dev libvulkan-dev \
            libxcb1-dev libpipewire-0.3-dev libpam0g-dev libglib2.0-dev \
            libpolkit-agent-1-dev libpolkit-gobject-1-dev

      - uses: actions/checkout@v4

      - name: Lint config scripts
        run: |
          python3 -m py_compile $(find config/quickshell -name '*.py')
          shellcheck -S error $(find config ci install.sh uninstall.sh check-deps.sh -name '*.sh')

      - name: Build Quickshell
        run: |
          git clone https://github.com/quickshell-mirror/quickshell.git /tmp/qs \
            || git clone https://git.outfoxxed.me/quickshell/quickshell.git /tmp/qs
          git -C /tmp/qs checkout "$QS_REF"
          cmake -GNinja -S /tmp/qs -B /tmp/qs/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DINSTALL_QML_PREFIX=lib/x86_64-linux-gnu/qt6/qml \
            -DDISTRIBUTOR="Minflair Debian trixie" \
            -DCRASH_HANDLER=OFF -DCRASH_REPORTER=OFF -DI3=OFF -DI3_IPC=OFF
          cmake --build /tmp/qs/build
          DESTDIR=/tmp/pkg cmake --install /tmp/qs/build
          [ -e /tmp/pkg/usr/bin/qs ] || ln -s quickshell /tmp/pkg/usr/bin/qs
          find /tmp/pkg -maxdepth 6 | head -40

      - name: Make .deb
        run: ./ci/make-deb.sh /tmp/pkg "${QS_REF#v}" out

      - name: Smoke test (install deb, load config headless)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./out/quickshell_*.deb \
            python3-gi python3-pam socat
          quickshell --version
          ./ci/smoke-test.sh config/quickshell

      - name: Assemble zip
        run: ./ci/make-zip.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: minflair-quickshell-trixie
          path: out/minflair-quickshell-trixie.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/minflair-quickshell-trixie.zip
